name: Build Shouq APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.5-bin.zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create project and copy files
        run: |
          cordova create build com.shouq.app "shouq"
          cp index.html build/www/
          cp style.css build/www/
          cp script.js build/www/
          cp config.xml build/
          cp icon.png build/

      - name: Add Android platform
        run: |
          cd build
          cordova platform add android@12.0.1

      - name: Add plugins
        run: |
          cd build
          cordova plugin add cordova-plugin-vibration
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-device

      - name: Build APK
        run: |
          cd build
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shouq-apk
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
