name: Build Shouq APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create project & copy files
        run: |
          cordova create build com.shouq.app "شوق"
          cp index.html build/www/
          cp style.css build/www/
          cp script.js build/www/
          cp config.xml build/
          cp icon.png build/

      - name: Add Android platform
        run: |
          cd build
          cordova platform add android@12.0.1

      - name: Fix Gradle version
        run: |
          ls -la build/platforms/android/
          ls -la build/platforms/android/gradle/ || echo "no gradle dir"
          find build/platforms/android -name "gradle-wrapper.properties" -type f
          WRAPPER=$(find build/platforms/android -name "gradle-wrapper.properties" -type f | head -1)
          if [ -n "$WRAPPER" ]; then
            DIR=$(dirname "$WRAPPER")
            echo "Found wrapper at: $WRAPPER"
            echo "Directory: $DIR"
            cat "$WRAPPER"
            rm -f "$WRAPPER"
            cat > "$WRAPPER" << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
            echo "Updated wrapper:"
            cat "$WRAPPER"
          else
            echo "No gradle-wrapper.properties found, creating..."
            mkdir -p build/platforms/android/gradle/wrapper
            cat > build/platforms/android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

      - name: Add plugins
        run: |
          cd build
          cordova plugin add cordova-plugin-vibration
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-device

      - name: Build APK
        run: |
          cd build
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shouq-apk
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
